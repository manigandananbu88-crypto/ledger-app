<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#F1EFE6" />
<link rel="manifest" href="manifest.json" />
<title>Ledger — daily tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230F6E56'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23F1EFE6' font-family='Georgia,serif'%3EL%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230F6E56'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23F1EFE6' font-family='Georgia,serif'%3EL%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1EFE6; --surface:#FFFFFF; --ink:#1C2420; --ink-soft:#5B655F;
    --ink-faint:#96988E; --line:#DAD6C8; --accent:#0F6E56; --accent-soft:#DCEDE6;
    --warm:#B8541E; --warm-soft:#F5E2D6; --danger:#B23A3A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  body{padding-bottom:3rem;min-height:100vh;}
  .wrap{max-width:520px;margin:0 auto;padding:0 1.1rem;}
  reminderTimer = null;
  setJSON('ledger_reminders_on', false);
  remBtn.textContent = 'Enable';
  remBtn.classList.remove('on');
}

remBtn.addEventListener('click', ()=>{
  if(remBtn.classList.contains('on')){ stopReminders(); return; }
  if(!('Notification' in window)){ alert('Notifications are not supported in this browser.'); return; }
  Notification.requestPermission().then(perm=>{
    if(perm === 'granted') startReminders();
    else alert('Notification permission was not granted.');
  });
});

if(getJSON('ledger_reminders_on', false) && 'Notification' in window && Notification.permission === 'granted'){
  startReminders();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
    </html>
